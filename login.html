<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Ambulans Seyegan</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

    <div class="title">
        <h2>Ambulans Seyegan</h2>
        <p>Sistem Informasi Layanan</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('admin')">BPH</div>
        <div class="tab" onclick="switchTab('user')">Petugas</div>
    </div>

    <div id="desc" class="note">
        Login sebagai BPH untuk akses dashboard
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
        <div class="input-group">
            <input type="text" id="username" placeholder="Masukkan username">
        </div>

        <div class="input-group" style="position: relative;">
    <input type="password" id="password" placeholder="Masukkan password">

    <span onclick="togglePassword()" id="eyeIcon"
        style="
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #aaa;
    ">
        👁️
    </span>
    </div>

        <button onclick="login()">Masuk sebagai BPH</button>
    </div>

    <div class="note">atau</div>

    <button class="secondary" id="userBtn">
        Masuk sebagai driver/petugas
    </button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="script.js"></script>
</body>
</html>
